<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazen Games</title>
<link rel="icon" id="favicon">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#10294a;--orange:#f28c28;--sky:#a9d6f0;--bg:#f3f6fa;--line:#dbe4ef;--muted:#5b6b82}
*{box-sizing:border-box}
body{margin:0;background:#1e6b3c;color:var(--navy);font-family:Manrope,system-ui,"Segoe UI",sans-serif;line-height:1.5}
header{background:#071423;color:#fff}
.bar{max-width:960px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:12px}
.bar{justify-content:center}
.bar img{height:84px;width:auto;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.bar strong{font-weight:800;font-size:1.05rem}
.hero{max-width:960px;margin:0 auto;padding:36px 20px 8px}
.hero h1{margin:0;color:#fff;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.85);max-width:52ch}
main{max-width:960px;margin:0 auto;padding:20px 20px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.logo{display:block;border-radius:10px;overflow:hidden;aspect-ratio:1}
.logo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.logo:hover img{transform:scale(1.04)}
.card h2{margin:0;font-size:.98rem;font-weight:800}
.card p{margin:-6px 0 0;font-size:.8rem;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:auto}
.btns a,.btns button{flex:1;padding:7px 0;border-radius:8px;font:inherit;font-size:.84rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
.play{background:var(--orange);border:1px solid var(--orange);color:#fff}
.info{background:#fff;border:1px solid var(--line);color:var(--navy)}
.play:hover{background:#d97a1b}.info:hover{border-color:var(--navy)}
.soon{border-style:dashed;border-color:rgba(255,255,255,.45);background:transparent;align-items:center;justify-content:center;text-align:center;color:rgba(255,255,255,.8);font-size:.85rem;min-height:180px}
.createur{max-width:960px;margin:0 auto 24px;padding:0 20px}
.createur .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.createur h2{margin:0 0 10px;font-size:1.05rem;font-weight:800}
.createur dl{margin:0;font-size:.9rem}
footer{max-width:960px;margin:0 auto;padding:0 20px 32px;color:rgba(255,255,255,.75);font-size:.8rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
dialog{border:0;border-radius:14px;padding:22px;max-width:360px;width:calc(100% - 40px);color:var(--navy);font-family:inherit}
dialog::backdrop{background:rgba(16,41,74,.6)}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dh img{width:48px;height:48px;border-radius:10px}
.dh h3{margin:0;font-size:1.15rem}
dialog p{margin:0 0 10px;font-size:.92rem}
dl{margin:0 0 16px;font-size:.88rem;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
dt{font-weight:800}dd{margin:0;color:var(--muted)}
dialog button{padding:8px 16px;border-radius:8px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header><div class="bar"><img id="marque" alt="Mazen Games"></div></header>

<section class="hero">
  <h1>Jeux en ligne</h1>
  <p>Une collection de jeux créés de A à Z. Clique sur un logo ou sur Jouer pour lancer un jeu.</p>
</section>

<main>
  <div class="grid" id="liste"></div>
</main>
<section class="createur">
  <div class="box">
    <h2>Informations du créateur</h2>
    <dl>
      <dt>Créateur</dt><dd>Mazen</dd>
      <dt>Pays</dt><dd>Maroc</dd>
      <dt>Projet</dt><dd>Je travaille sur ce site et sur mes jeux depuis 2026.</dd>
    </dl>
  </div>
</section>
<footer>© 2026 Mazen Games</footer>

<dialog id="fenetre">
  <div class="dh"><img id="i-logo" alt=""><h3 id="i-titre"></h3></div>
  <p id="i-desc"></p>
  <dl id="i-details"></dl>
  <button id="fermer">Fermer</button>
</dialog>

    <a class="logo" href="${j.lien}" aria-label="Jouer à ${j.titre}"><img src="${j.logo}" alt=""></a>
    <h2>${j.titre}</h2>
    <p>${j.court}</p>
    <div class="btns">
      <a class="play" href="${j.lien}">Jouer</a>
      <button class="info" type="button">Info</button>
    </div>`;
  c.querySelector(".info").addEventListener("click", () => ouvrir(j));
  liste.appendChild(c);
});

const bientot = document.createElement("div");
bientot.className = "card soon";
bientot.textContent = "Prochain jeu bientôt";
liste.appendChild(bientot);

function ouvrir(j){
  document.getElementById("i-logo").src = j.logo;
  document.getElementById("i-titre").textContent = j.titre;
  document.getElementById("i-desc").textContent = j.info.description;
  const dl = document.getElementById("i-details");
  dl.innerHTML = "";
  Object.entries(j.info.details || {}).forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  });
  fenetre.showModal();
}
document.getElementById("fermer").addEventListener("click", () => fenetre.close());
fenetre.addEventListener("click", e => { if (e.target === fenetre) fenetre.close(); });
</script>
</body>
</html>
